<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikotin asılılığı zamanı istifadə olunan vasitələr</title>
    <style>
        .product-section {
            padding: 50px 10%;
            background-color: #f9f9f9;
        }

        .section-title {
            text-align: center;
            font-size: 34px;
            margin-bottom: 30px;
            color: #dc1515c2;
            transition: .4s;
        }
        .section-title:hover{
            scale: 1.02;
              /* box-shadow:0 0 15px rgba(158, 29, 29, 0.8),
           0 0 20px rgba(12, 3, 3, 0.7),
           0 0 25px rgb(246, 243, 243,0.6),
           0 0 30px rgb(246, 243, 243,0.5),
           0 0 35px rgb(246, 243, 243,0.4); */
        } 

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 163px;
        }

        .product-card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            width: 300px;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-image img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
        }

        .product-info h3 {
            font-size: 18px;
            margin: 15px 0 5px;
            color: #2c3e50;
        }

        .category {
            color: #7f8c8d;
            font-size: 14px;
        }

        .price {
            display: block;
            font-weight: bold;
            color: #27ae60;
            margin: 10px 0;
            font-size: 18px;
        }

        .buy-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .buy-btn:hover {
            background-color: #219150;
        }
    </style>
</head>
<body>
    <section class="product-section">
            <h2 class="section-title">Nikotin asılılığı zamanı istifadə olunan vasitələr</h2>

            <div class="product-grid">
                
                <div class="product-card">
                    <div class="product-image">
                        <img src="nk1.png" alt="Dərman">
                    </div>
                    <div class="product-info">
                        <h3>Tabeks 1.5 mq N100</h3>
                        <!-- <p class="category">Reseptlə satılır</p> -->
                        <span class="price">30 AZN</span>
                        <button class="buy-btn">Səbətə at</button>
                        <p class="Sitizin"></p>

                    </div>
                </div>
                <div class="product-card">
                    <div class="product-image">
                        <img src="nk2.png" alt="Dərman">
                    </div>
                    <div class="product-info">
                        <h3>Nikitabs 1.5 mq N100</h3>
                        <!-- <p class="category">Reseptlə satılır</p> -->
                        <span class="price">30 AZN</span>
                        <button class="buy-btn">Səbətə at</button>
                        <p class="Sitizin"></p>

                    </div>
                </div>

                <div class="product-card">
                    <div class="product-image">
                        <img src="nk3.png" alt="Dərman">
                    </div>
                    <div class="product-info">
                        <h3>Nikorette 4 mq N30 (nanə)</h3>
                        <!-- <p class="category">Reseptlə satılır</p> -->
                        <span class="price">Stokda yoxdur</span>
                        <button class="buy-btn">Səbətə at</button>
                        <p class="Nikotin"></p>

                    </div>
                </div>

                <div class="product-card">
                    <div class="product-image">
                        <img src="nk4.png" alt="Dərman">
                    </div>
                    <div class="product-info">
                        <h3>Nikorette sprey 150 doz N1</h3>
                        <!-- <p class="category">Reseptlə satılır</p> -->
                        <span class="price">Stokda yoxdur</span>
                        <button class="buy-btn">Səbətə at</button>
                        <p class="Nikotin"></p>

                    </div>
                </div>

                <div class="product-card">
                    <div class="product-image">
                        <img src="nk5.png" alt="Dərman">
                    </div>
                    <div class="product-info">
                        <h3>Afobazol 10 mq N60</h3>
                        <!-- <p class="category">Reseptlə satılır</p> -->
                        <span class="price">Stokda yoxdur</span>
                        <button class="buy-btn">Səbətə at</button>
                        <p class="Fabomotizol"></p>

                    </div>
                </div>




















            </div>
        </section>
</body>
</html>
