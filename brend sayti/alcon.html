İstehsalçı Ölkə/Страна производитель:Belçika/Бельгия (və ya ABŞ/США)Firma:ALCON"></div>
    <div class="alcon sekil4" data-info="Tərkibi:Moksifloksasin 0,5% (Моксифлоксацин) — güclü antibiotikdir.Təyinatı:Bakterial mənşəli göz infeksiyalarının müalicəsi üçün steril göz damcısıdır (капли глазные стерильно).Həcmi: 5 ml flakonda təqdim olunur.İstehsalçı: Novartis (Alcon ailəsinə məxsusdur).Təsiri: Bakteriyaların DNT sintezini pozaraq onların inkişafını dayandırır." ></div>
    <div class="alcon sekil5" data-info="Tərkibi: HydraGlyde nəmləndirici matrisi (увлажняющая матрица) və dezinfeksiyaedici maddələr — linzalar üçün çoxfunksiyalı məhluldur.Təyinatı: Yumşaq kontakt linzaların təmizlənməsi, dezinfeksiyası (дезинфекция) və saxlanması üçün istifadə olunur.Həcmi: Müxtəlif ölçülü flakonlarda (məsələn: 60 ml, 300 ml) təqdim olunur."></div>
    <div class="alcon sekil6" data-info="Tərkibi: Brinzolamid 10 mq/ml və Brimonidin tartrat 2 mq/ml (Бринзоламид + Бримонидин) — kombinə olunmuş göz damcısıdır.Təyinatı: Qlaukoma və yüksək göz daxili təzyiqin(глазное давление) müalicəsi üçün istifadə olunur.Həcmi: 5 ml flakonda(стерильная суспензия) təqdim olunur.İstehsalçı: Alcon.Təsiri: Göz daxili mayenin yaranmasını azaldır və axınını yaxşılaşdıraraq təzyiqi effektiv şəkildə aşağı salır."></div>
    <div class="alcon sekil7" data-info="Tərkibi: Olopatadin 0,7% (Олопатадин) — yüksək konsentrasiyalı allergiya əleyhinə vasitədir.
Təyinatı: Allergiya ilə əlaqəli göz qaşınmasının (зуд в глазах) müalicəsi və qarşısının alınması üçün nəzərdə tutulub.Həcmi: 2,5 ml flakonda təqdim olunur.İstehsalçı: Alcon.Təsiri: Histamin reseptorlarını bloklayaraq 24 saat ərzində gözlərdəki qaşınma, qızartı və şişkinliyi (аллергические реакции) aradan qaldırır."></div>
    <div class="alcon sekil8" data-info="Tərkibi: Amitriptilin (Амитриптилин) — tritsiklik antidepressantlar qrupuna aid olan dərmandır.Təyinatı: Müxtəlif növ depressiyaların, həyəcan pozuntularının (тревожные состояния) və xroniki ağrıların müalicəsində istifadə olunur.Həcmi: Adətən 10 mq və ya 25 mq-lıq tablet (таблетки) formasında təqdim olunur.İstehsalçı: Müxtəlif əczaçılıq şirkətləri tərəfindən istehsal edilir (məsələn, müxtəlif ölkələrin generik brendləri)."></div>
    <div class="alcon sekil9" data-info="Tərkibi: Propilen qlikol 0,6% və LipiTech sistemi (система липидов) — göz yaşının yağ təbəqəsini bərpa edən damcıdır.Təyinatı: Göz quruluğu (синдром сухого глаза) və buxarlanma nəticəsində yaranan qıcıqlanmanı aradan qaldırmaq üçündür.
Həcmi: 10 ml flakonda təqdim olunur.İstehsalçı: Alcon.Təsiri: Gözün təbii yaş təbəqəsini sabitləşdirir, nəmin buxarlanmasının qarşısını alır və uzunmüddətli rahatlıq (длительное облегчение) təmin edir."></div>
    <div class="alcon sekil10" data-info="Tərkibi: Nepafenak 0,1% (Непафенак) — qeyri-steroid iltihab əleyhinə (НПВС) göz damcısıdır.
Təyinatı: Katarakta əməliyyatı ilə bağlı yaranan ağrı və iltihabın (воспаление) müalicəsi üçün istifadə olunur.Həcmi: 5 ml flakonda (стерильная суспензия) təqdim olunur.İstehsalçı: Alcon.Təsiri: Göz toxumalarına sürətlə nüfuz edərək ağrını kəsir, şişkinliyi azaldır və əməliyyatdan sonrakı fəsadların qarşısını alır.
"></div>
    <div class="alcon sekil11" data-info="Tərkibi: Olopatadin 0,1% (Олопатадин) — allergiya əleyhinə effektiv göz damcısıdır.
Təyinatı: Allergik konyuktivitlə bağlı göz qaşınması, sulanma və qızartının (аллергические реакции) müalicəsi üçün istifadə olunur.Həcmi: 5 ml flakonda təqdim olunur.İstehsalçı: Alcon.Təsiri: Histamin ifrazını bloklayaraq allergiyanın simptomlarını sürətlə aradan qaldırır."></div>
