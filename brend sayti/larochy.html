    <a href="larochy.html" class="larochy sekil1" data-info="La Roche-Posay Anthelios 100 KA Nədir:Günəşə çox həssas və ləkəyə meyilli dərilər üçün yüksək qorumalı (SPF 50+) müalicəvi kremdir.Tərkibi: Niacinamide, Panthenol və Termal su (bərpa edir və sakitləşdirir).Fərqi: Hüceyrə səviyyəsində DNT zədələnməsinin və aktinik keratozun (günəş xərçəngi riski) qarşısını alır"></a>
    <div class="larochy sekil2" data-info="La Roche-Posay Anthelios 100 KA+Təyinatı: Günəşə çox həssas və ləkəyə meyilli dərilər üçün çox yüksək qorumalı (SPF 50+) müalicəvi kremdir.Əsas Tərkibi: * Niacinamide: Dərini sakitləşdirir və baryeri gücləndirir.Panthenol (B5): Nəmləndirir və dərini bərpa edir.Termal Su: Antioksidant təsir göstərir."></div>
    <div class="larochy sekil3" data-info="La Roche-Posay Anthelios UVMUNE 400 Dermo-Pediatrics Spray haqqında qısa məlumat.Təyinatı: Uşaqların həssas və atopik dərisi üçün çox yüksək qorumalı günəş spreyi.Qoruma: SPF 50+ (UVB və ən zərərli uzun UVA şüalarından qoruyur).Üstünlükləri: Dəridə ağ iz qoymur, yağlı deyil və görünməz teksturaya malikdir"></div>
    <div class="larochy sekil4" data-info=": Həssas və quru dərilər üçün dərini qurutmadan təmizləyən və sakitləşdirən duş gelidir.İstehsalçı: La Roche-Posay, Fransa.Tərkibi: Niasinamid, Karite (Shea) yağı və La Roche-Posay termal suyu.Xüsusiyyəti: Sabun və paraben içermir; körpələr, uşaqlar və böyüklər üçün uyğundur."></div>
    <div class="larochy sekil5" data-info="Yağlı və akneyə (sivriyəyə) meyilli dərilər üçün təmizləyici geldir. Dərini dərindən təmizləyir, yağlılığı azaldır və pH balansını qoruyur.İstehsalçı: La Roche-Posay, Fransa.Tərkibi: Sink (yağı tənzimləyir), təmizləyici agentlər və La Roche-Posay termal suyu (sakitləşdirir).Xüsusiyyəti: Sabunsuz, alkolsuz və parabensizdir. Həssas dərilər üçün uyğundur.
"></div>
    <div class="larochy sekil6" data-info="Çox həssas və allergiyaya meyilli dərilər üçün nəzərdə tutulmuş, gecə boyu dərini bərpa edən ve sakitləşdirən nəmləndiricidir.Tərkibi: Sphingobioma (mikrobiomu dəstəkləyir), Neurosensine (həssaslığı azaldır) və La Roche-Posay termal suyu.Xüsusiyyəti:Tərkibində etil spirti və ətir (parfüm) yoxdur."></div>
    <div class="larochy sekil7" data-info="Ultra-uzun UVA şüalarından yüksək mühafizə təmin edən, dərini günəş yanıqlarından və hüceyrə  zədələnmələrindən qoruyan üz kremidir.Xüsusiyyəti:Görünməz(şəffaf) teksturaya malikdir, yağlılıq hissi buraxmır,suya və tərə davamlıdır.Mühafizə dərəcəsi:SPF 50+ (çox yüksək qoruma)."></div>
    <div class="larochy sekil8" data-info="Böyüklərdə akne (sivrişə) meyilli dərilər üçün nəzərdə tutulub. Qara nöqtələri, ləkələri və genişlənmiş məsamələri hədəf alır.Tərkibi:Üçlü turşu kompleksi — Salisil turşusu, Qlikol turşusu, LHA və sakitləşdirici Niasinamid.Effekti:Gündəlik pilinq təsiri göstərərək dərini yeniləyir və hamarlaşdırır.İstifadəsi:Adətən axşam təmizlənmiş dəriyə tətbiq olunur.⁠serum goy"></div>
    <div class="larochy sekil9" data-info="Akne (sivrişə) meyilli dərilər üçün nəzərdə tutulub;ləkələri,qara nöqtələri və sızanaq sonrası izləri hədəf alır.Təsir mexanizmi:Dərini nəmləndirir, eyni zamanda sızanaqların yenidən yaranmasının qarşısını almağa kömək edir.Tərkibi: Mikrobiom elminə əsaslanan Phylobioma aktiv maddəsi, Niasinamid və Salisil turşusu ilə zəngindir."></div>
    <div class="larochy sekil10" data-info="Yağlı və həssas dərilər üçün makiyaj təmizləyicidir. Dərini kirdən və yağdan dərindən təmizləyir.Xüsusiyyəti: Durulama (yumaq) tələb etmir. Üz və göz ətrafı üçün uyğundur.Tərkibi: Sink (yağlılığı tənzimləyir) və sakitləşdirici termal su ilə zəngindir.⁠uz yuma"></div>
    <div class="larochy sekil11" data-info="Yağlı və akneyə meyilli dərilər üçün təmizləyici gelin qənaətli doldurma paketidir.Təsiri: Dərini kirdən və artıq yağdan təmizləyir, pH balansını qoruyur və parlamanı azaldır.Xüsusiyyəti: Daha az plastik istifadəsi üçün nəzərdə tutulmuş ekoloji paketdir."></div>    
    <div class="larochy sekil12" data-info="Çox quru və atopik ekzemaya meyilli dərilər üçün nəzərdə tutulmuş nəmləndirici yuyucu yağdır.
Təsiri: Dərini dərindən nəmləndirir, baryerini bərpa edir və şiddətli qaşıntını sakitləşdirir.İstifadəsi: Körpələr, uşaqlar və böyüklər üçün həm duş yağı, həm də vanna üçün uyğundur."></div>
